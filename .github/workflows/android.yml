name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Собрать APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KARMAN_KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/release.jks
      KARMAN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KARMAN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KARMAN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Подготовить ключ подписи
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks

      - name: Проверить ключ подписи для релиза
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 == ''
        run: |
          echo "Секрет KEYSTORE_BASE64 не задан: APK получил бы случайную отладочную подпись." >&2
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка release APK
        id: build
        working-directory: android
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Загрузить APK как артефакт
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: karman-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Опубликовать релиз
        id: release
        if: steps.build.outcome == 'success' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Карман ${{ github.ref_name }}
          body: |
            Android-клиент «Кармана».

            Установите APK, укажите адрес сервера (например, `http://192.168.1.108:8096`), войдите под своим аккаунтом.
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true

      # Журнал и итог пишем в ветку ci-log: так результат виден без доступа к Actions API.
      - name: Записать журнал и итог в ветку ci-log
        if: always()
        run: |
          mkdir -p ci
          if [ -f android/build.log ]; then
            cp android/build.log ci/last-build.log
          else
            echo "Gradle не оставил журнал" > ci/last-build.log
          fi

          apk=android/app/build/outputs/apk/release/app-release.apk
          {
            echo "run: ${GITHUB_RUN_ID}"
            echo "ref: ${GITHUB_REF}"
            echo "build: ${{ steps.build.outcome }}"
            echo "release: ${{ steps.release.outcome }}"
            if [ -f "$apk" ]; then
              echo "apk: $(stat -c %s "$apk") bytes"
            else
              echo "apk: отсутствует"
            fi
          } > ci/release.txt

          git config user.name "karman-ci"
          git config user.email "ci@karman.local"
          git checkout -B ci-log
          git add -f ci/last-build.log ci/release.txt
          git commit -m "ci: build log ${GITHUB_RUN_ID}" || true
          git push -f origin ci-log

      - name: Проверить результат сборки
        if: steps.build.outcome != 'success'
        run: exit 1
